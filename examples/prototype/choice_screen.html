<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>豫东战役 · 反事实推演</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Noto Serif SC", "Songti SC", serif;
    background: #14161a; color: #d8d5cc;
    max-width: 720px; margin: 0 auto; padding: 24px 16px; line-height: 1.8;
  }
  h1 { font-size: 1.3rem; letter-spacing: 2px; text-align: center; margin-bottom: 4px; }
  .sub { text-align: center; font-size: .8rem; color: #7a786e; margin-bottom: 16px; }
  :root {
    --us: #4a9edb; --us-bg: rgba(74,158,219,.18);
    --foe: #c1554d; --foe-bg: rgba(193,85,77,.18);
    --amber: #e8b04b; --amber-bg: rgba(232,176,75,.12);
    --grey: #7a786e; --ink: #d8d5cc;
    --river: #2a5070; --rail: #4a4f58; --green: #7fb069; --green-bg: rgba(127,176,105,.15);
  }
  .map-wrap { margin-bottom: 14px; }
  .map {
    position: relative; width: 100%; aspect-ratio: 1.6 / 1;
    background: #1a1e24; border: 1px solid #2e343e; border-radius: 4px; overflow: hidden;
  }
  .map svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
  .map-units { position: absolute; inset: 0; z-index: 2; }
  .m-unit {
    position: absolute; transform: translate(-50%, -50%);
    padding: 4px 8px; border-radius: 3px; font-size: .72rem; white-space: nowrap;
    line-height: 1.4; text-align: center;
  }
  .m-us   { background: var(--us-bg); border: 1px solid var(--us); color: #9ecfef; }
  .m-foe  { background: var(--foe-bg); border: 1px solid var(--foe); color: #e0a49e; }
  .m-amber{ background: var(--amber-bg); border: 1px dashed var(--amber); color: var(--amber); }
  .m-city { background: rgba(0,0,0,.4); border: 1px solid #6a6560; color: #b8b4a8; font-weight: bold; }
  .m-note { background: rgba(0,0,0,.3); color: var(--grey); font-size: .66rem; border: 1px dashed #3a3f48; font-style: italic; }
  .m-unit .v { display: block; font-size: .66rem; opacity: .85; font-weight: bold; }
  .m-unit .st { display: block; font-size: .62rem; padding: 1px 5px; border-radius: 2px; margin-top: 2px; }
  .st.danger { background: var(--foe-bg); color: #e0a49e; }
  .st.warn   { background: var(--amber-bg); color: var(--amber); }
  .st.good   { background: var(--green-bg); color: var(--green); }
  .st.neutral{ background: rgba(0,0,0,.3); color: var(--grey); }
  .m-arrow {
    position: absolute; z-index: 4; font-size: 1.2rem; color: var(--us);
    transform: translate(-50%, -50%); display: none; text-shadow: 0 0 6px rgba(0,0,0,.9);
  }
  .m-arrow.show { display: block; animation: fadein .4s; }
  @keyframes fadein { from { opacity: 0; transform: translate(-50%,-50%) scale(.5); } to { opacity: 1; transform: translate(-50%,-50%) scale(1); } }
  .map-legend { display: flex; gap: 14px; font-size: .68rem; color: var(--grey); margin-top: 6px; flex-wrap: wrap; }
  .map-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 3px; vertical-align: -1px; }
  .meters { display: flex; gap: 20px; margin-bottom: 14px; }
  .meter { flex: 1; }
  .meter .m-label { display: flex; justify-content: space-between; font-size: .8rem; margin-bottom: 3px; }
  .m-track { height: 10px; background: #23262c; border-radius: 5px; overflow: hidden; }
  .m-fill { height: 100%; border-radius: 5px; transition: width .5s, background .5s; }
  .m-fill.us { background: var(--us); }
  .m-fill.us.mid { background: var(--amber); }
  .m-fill.us.low { background: var(--foe); }
  .m-fill.init { background: var(--amber); }
  .echo { background: #23201a; border-left: 3px solid var(--green); padding: 10px 14px; margin-bottom: 12px; font-size: .85rem; color: #c9c2ae; }
  .brief { background: #1c1f25; border-left: 3px solid var(--amber); padding: 12px 14px; margin-bottom: 12px; font-size: .92rem; }
  .brief .date { color: var(--grey); font-size: .78rem; display: block; margin-bottom: 4px; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .options button {
    text-align: left; padding: 12px 14px; width: 100%;
    background: #22262d; color: var(--ink); border: 1px solid #3a3f48;
    cursor: pointer; font-family: inherit; transition: border-color .15s; line-height: 1.6;
  }
  .options button:hover:not(:disabled) { border-color: var(--amber); background: #2a2f37; }
  .options button:disabled { cursor: default; opacity: .45; }
  .options button.chosen { border-color: var(--amber); opacity: 1; }
  .options button.rejected { display: none; }
  .opt-main { font-size: .95rem; }
  .opt-icons { display: block; font-size: .8rem; margin-top: 4px; color: #8f8c80; }
  .skulls { letter-spacing: 2px; }
  .opt-more { display: none; font-size: .8rem; margin-top: 8px; padding-top: 8px; border-top: 1px dashed #3a3f48; }
  button.chosen .opt-more { display: block; }
  .prob { display: flex; height: 8px; border-radius: 4px; overflow: hidden; margin-top: 6px; max-width: 260px; }
  .prob .pg { background: var(--green); } .prob .pn { background: #6b7280; } .prob .pb { background: var(--foe); }
  .prob-legend { font-size: .7rem; color: var(--grey); margin-top: 3px; }
  .dice { text-align: center; padding: 10px; margin: 12px 0; background: #1a1d22; border: 1px dashed #4a5160; font-size: .95rem; display: none; }
  .dice .good { color: var(--green); } .dice .mid { color: #c9c2ae; } .dice .bad { color: var(--foe); }
  .consequence { padding: 12px 14px; font-size: .9rem; background: #1c1f25; border-left: 3px solid var(--grey); display: none; }
  .next-btn, .restart { display: block; margin: 20px auto 0; padding: 10px 32px; background: none; color: var(--amber); border: 1px solid var(--amber); font-family: inherit; font-size: .95rem; cursor: pointer; }
  .next-btn:hover, .restart:hover { background: var(--amber); color: #14161a; }
  .ending h2 { text-align: center; margin: 24px 0 8px; color: var(--amber); letter-spacing: 3px; }
  .ending .verdict { text-align: center; font-size: 1.05rem; margin-bottom: 20px; }
  .ending .chain { background: #1c1f25; padding: 14px 16px; margin-bottom: 12px; font-size: .9rem; }
  .reveal { font-size: .85rem; color: var(--grey); margin-top: 16px; }
  .reveal em { color: var(--green); font-style: normal; }
  .hidden { display: none; }
  footer { text-align: center; font-size: .75rem; color: #55534b; margin-top: 40px; }
</style>
</head>
<body>

<h1>豫东战役 · 推演</h1>
<p class="sub">1948.6.17 – 7.6 · 三个决策节点 · 沙盘即情报</p>

<div id="game">
  <div class="meters">
    <div class="meter">
      <div class="m-label"><span style="color:var(--us)">■ 我军兵力</span><span id="wForce">充足</span></div>
      <div class="m-track"><div class="m-fill us" id="barForce" style="width:100%"></div></div>
    </div>
    <div class="meter">
      <div class="m-label"><span style="color:var(--amber)">■ 战场主动权</span><span id="wInit">均势</span></div>
      <div class="m-track"><div class="m-fill init" id="barInit" style="width:50%"></div></div>
    </div>
  </div>

  <div class="map-wrap">
    <div class="map" id="map">
      <svg id="mapSvg" viewBox="0 0 600 375" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="map-units" id="mapUnits"></div>
      <div class="m-arrow" id="mapArrow">➤</div>
    </div>
    <div class="map-legend">
      <span><i style="background:var(--us)"></i>我军</span>
      <span><i style="background:var(--foe)"></i>敌军</span>
      <span><i style="border:1px dashed var(--amber);background:none"></i>未证实</span>
      <span><i style="background:var(--river)"></i>黄河</span>
      <span><i style="background:var(--rail);height:2px"></i>陇海铁路</span>
      <span><i style="background:var(--green)"></i>有利</span>
    </div>
  </div>

  <div class="echo hidden" id="echoBox"></div>
  <div class="brief">
    <span class="date" id="nDate"></span>
    <span id="nText"></span>
  </div>
  <div class="dice" id="diceBox"></div>
  <div class="options" id="nOptions"></div>
  <div class="consequence" id="nConsequence"></div>
  <button class="next-btn hidden" id="btnNext" onclick="nextNode()">继续 →</button>
</div>

<div id="ending" class="ending hidden">
  <h2>战 役 结 局</h2>
  <p class="verdict" id="eVerdict"></p>
  <div class="chain" id="eJinan"></div>
  <div class="chain" id="eHuaihai"></div>
  <button class="restart" onclick="restart()">重新推演</button>
  <p class="reveal" id="eReveal"></p>
</div>

<footer>看沙盘，掂风险，下决心。剩下的交给天意。</footer>

/* ============ 沙盘渲染 ============ */
function renderMap(mapData) {
  const svg = document.getElementById('mapSvg');
  const unitsBox = document.getElementById('mapUnits');
  const arrow = document.getElementById('mapArrow');
  arrow.classList.remove('show');

  // SVG 坐标系：600x375，百分比坐标需转换
  const toX = px => px * 6;   // 0~100% → 0~600
  const toY = py => py * 3.75; // 0~100% → 0~375

  let dynSvg = '';
  (mapData.gaps || []).forEach(g => {
    const x = toX(g.x), y = toY(g.y), w = toX(g.w), h = toY(g.h);
    dynSvg += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="rgba(232,176,75,.1)" stroke="#e8b04b" stroke-width="1.5" stroke-dasharray="4 3" rx="2"/>`;
    if (g.label) dynSvg += `<text x="${x + w/2}" y="${y + h/2 + 3}" fill="#e8b04b" font-size="9" text-anchor="middle" opacity=".8">${g.label}</text>`;
  });
  (mapData.routes || []).forEach(r => {
    dynSvg += `<path id="rp" d="${r.d}" fill="none"/>`;
    dynSvg += `<path d="${r.d}" fill="none" stroke="#c1554d" stroke-width="1.5" stroke-dasharray="5 4" opacity=".6" marker-end="url(#ah)"/>`;
    dynSvg += `<text fill="#c1554d" font-size="8" opacity=".7"><textPath href="#rp" startOffset="20%" text-anchor="middle">${r.label}</textPath></text>`;
  });
  svg.innerHTML = BASE_SVG + dynSvg;

  let html = '';
  (mapData.items || []).forEach(it => {
    if (it.t === 'note') {
      html += `<div class="m-unit m-note" style="left:${it.x}%;top:${it.y}%">${it.label}</div>`;
    } else {
      const cls = { us:'m-us', foe:'m-foe', amber:'m-amber', city:'m-city' }[it.t];
      html += `<div class="m-unit ${cls}" style="left:${it.x}%;top:${it.y}%">${it.label}` +
        (it.v ? `<span class="v">${it.v}</span>` : '') +
        (it.st ? `<span class="st ${it.stCls || 'neutral'}">${it.st}</span>` : '') +
        `</div>`;
    }
  });
  unitsBox.innerHTML = html;
}

function showArrow(a) {
  if (!a) return;
  const arrow = document.getElementById('mapArrow');
  arrow.style.left = a.x + '%';
  arrow.style.top = a.y + '%';
  arrow.style.transform = `translate(-50%,-50%) rotate(${a.deg}deg)`;
  arrow.classList.add('show');
}

/* ============ 游戏逻辑 ============ */
function rollOutcome(opt) {
  const total = opt.outcomes.reduce((s, o) => s + o.p, 0);
  let r = Math.random() * total;
  for (const o of opt.outcomes) { r -= o.p; if (r <= 0) return o; }
  return opt.outcomes[opt.outcomes.length - 1];
}
const GRADE = {
  great:  { label: "★ 大成功 ---- 运气站在你这边", cls: "good" },
  normal: { label: "-- 如常", cls: "mid" },
  bad:    { label: "✕ 意外失利 ---- 命运翻出了底牌", cls: "bad" }
};
const FORCE_WORDS = v => v >= 90 ? ['充足','color:#4a9edb'] : v >= 75 ? ['尚可','color:#4a9edb']
  : v >= 60 ? ['受损','color:#e8b04b'] : v >= 40 ? ['告急','color:#c1554d'] : ['濒临极限','color:#c1554d'];
const INIT_WORDS = v => v >= 70 ? ['我方掌握','color:#e8b04b'] : v >= 55 ? ['偏向我方','color:#e8b04b']
  : v >= 40 ? ['均势','color:#a09c8e'] : v >= 25 ? ['偏向敌方','color:#c1554d'] : ['敌方掌握','color:#c1554d'];
const skulls = d => '☠'.repeat(d) + '<span style="opacity:.2">' + '☠'.repeat(3-d) + '</span>';

let state, step, lastOutcome, path, history;

function restart() {
  state = { force: 100, init: 50 };
  step = 0; lastOutcome = null; path = []; history = [];
  document.getElementById('ending').classList.add('hidden');
  document.getElementById('game').classList.remove('hidden');
  showNode();
}
function getNode() {
  if (step === 0) return NODE1;
  if (step === 1) return NODE2_VARIANTS[path[0]];
  return NODE3_VARIANTS[path[1]];
}

function showNode() {
  const node = getNode();
  document.getElementById('nDate').textContent = node.date;
  document.getElementById('nText').textContent = node.text;
  renderMap(node.map);

  const echoBox = document.getElementById('echoBox');
  if (lastOutcome && lastOutcome.echo) {
    echoBox.innerHTML = `<b style="color:#7fb069">因为上一节点：</b>${lastOutcome.echo}`;
    echoBox.classList.remove('hidden');
  } else echoBox.classList.add('hidden');
  renderMeters();

  const box = document.getElementById('nOptions');
  box.innerHTML = '';
  node.options.forEach((opt, i) => {
    const pg = opt.outcomes.find(o=>o.grade==='great')?.p || 0;
    const pb = opt.outcomes.find(o=>o.grade==='bad')?.p || 0;
    const pn = 100 - pg - pb;
    const b = document.createElement('button');
    b.innerHTML = `
      <span class="opt-main">${opt.text}</span>
      <span class="opt-icons"><span class="skulls">${skulls(opt.danger)}</span> ${opt.short}</span>
      <span class="opt-more">
        <span style="color:#7fb069">若成：${opt.ifWin}</span><br>
        <span style="color:#c1554d">若败：${opt.ifLose}</span>
        <div class="prob">
          <div class="pg" style="width:${pg}%"></div>
          <div class="pn" style="width:${pn}%"></div>
          <div class="pb" style="width:${pb}%"></div>
        </div>
        <div class="prob-legend">结果概率：大成功 ${pg}% ｜ 如常 ${pn}% ｜ 失利 ${pb}%</div>
      </span>`;
    b.onclick = () => choose(i);
    box.appendChild(b);
  });

  document.getElementById('diceBox').style.display = 'none';
  document.getElementById('nConsequence').style.display = 'none';
  document.getElementById('btnNext').classList.add('hidden');
}

function renderMeters() {
  const bf = document.getElementById('barForce'), bi = document.getElementById('barInit');
  const [fw, fc] = FORCE_WORDS(state.force), [iw, ic] = INIT_WORDS(state.init);
  bf.style.width = state.force + '%';
  bf.className = 'm-fill us ' + (state.force < 60 ? 'low' : state.force < 80 ? 'mid' : '');
  bi.style.width = state.init + '%';
  const wf = document.getElementById('wForce'), wi = document.getElementById('wInit');
  wf.textContent = fw; wf.style = fc;
  wi.textContent = iw; wi.style = ic;
}

function choose(i) {
  const node = getNode();
  const opt = node.options[i];
  showArrow(opt.arrow);
  const outcome = rollOutcome(opt);
  state.force = Math.min(120, Math.max(10, state.force + outcome.force));
  state.init  = Math.min(100, Math.max(0, state.init + outcome.init));
  lastOutcome = outcome; path.push(opt.id);
  history.push({ opt, outcome });

  [...document.getElementById('nOptions').children].forEach((b, j) => {
    b.disabled = true;
    if (j === i) b.classList.add('chosen'); else b.classList.add('rejected');
  });

  const dice = document.getElementById('diceBox');
  const g = GRADE[outcome.grade];
  dice.innerHTML = `<div class="${g.cls}">${g.label}</div>`;
  dice.style.display = 'block';

  const c = document.getElementById('nConsequence');
  c.textContent = outcome.result;
  c.style.display = 'block';
  renderMeters();
  document.getElementById('btnNext').classList.remove('hidden');
}

function nextNode() {
  step++;
  if (step < 3) showNode(); else showEnding();
}

function showEnding() {
  document.getElementById('game').classList.add('hidden');
  document.getElementById('ending').classList.remove('hidden');

  let verdict;
  if (state.init >= 70 && state.force >= 80) {
    verdict = "完胜 ---- 歼敌9万余人，华野首次攻克省会并歼灭一个兵团部，中原战局自此易手。";
  } else if (state.init >= 55) {
    verdict = "胜利 ---- 达成主要战役目的，全身而退，但战果未能进一步扩大。";
  } else if (state.init >= 40) {
    verdict = "消耗战 ---- 双方互有得失，中原战场进入数月对峙。";
  } else {
    verdict = "受挫 ---- 兵力折损过重，未达战役目的。国民党军宣称'中原大捷'。";
  }
  document.getElementById('eVerdict').textContent = verdict;

  document.getElementById('eJinan').innerHTML = "<b>→ 济南：</b>" + (state.force >= 75
    ? "兵力充足，攻城打援两手布置，14天攻克济南，全歼守军10万。"
    : "因豫东损耗，攻城集团被迫临时抽兵，攻城时间延长，但最终仍告克复。");
  document.getElementById('eHuaihai').innerHTML = "<b>→ 淮海：</b>" + (state.init >= 55
    ? "中原主动权在握，华野敢于在徐东张开决战架势。"
    : "中原形势胶着，统帅部对决战时机意见分歧，计划一再推迟。");

  const nodeAt = i => i === 0 ? NODE1 : (i === 1 ? NODE2_VARIANTS[path[i-1]] : NODE3_VARIANTS[path[i-1]]);
  const lines = history.map((h, i) => {
    const node = nodeAt(i);
    const hIdx = node.options.findIndex(o => o.hist);
    const tag = node.options.indexOf(h.opt) === hIdx ? '<em>史实选择</em>' : '<b>推演选择</b>';
    const fate = h.outcome.grade === 'great' ? '<em>命运偏爱</em>'
               : h.outcome.grade === 'bad' ? '<em>命运翻脸</em>' : '命运如常';
    return `节点${i+1}：${tag} · ${fate}`;
  }).join('<br>');
  const n = history.filter(h => h.outcome.grade !== 'normal').length;
  const note = n === 0 ? '三次掷骰皆如常----你复刻了史实的脉搏。'
    : `这一局有 ${n} 次命运的偏转。同样的选择，历史未必如此发生。`;

  document.getElementById('eReveal').innerHTML = `<b>史实对照</b><br>${lines}<br><br>${note}`;
}

restart();
</script>
</body>
</html>
