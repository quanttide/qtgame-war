<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>参谋长模式原型</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
  background: #1a1410;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 100vh;
  padding: 24px;
  color: #d4c8b8;
}
.prototype {
  width: 680px;
  background: #2a2218;
  border: 1px solid #4a3a28;
  border-radius: 8px;
  padding: 24px;
  box-shadow: 0 0 30px rgba(0,0,0,0.5);
}
h1 {
  font-size: 16px;
  color: #c8a878;
  text-align: center;
  margin-bottom: 20px;
  font-weight: normal;
  letter-spacing: 2px;
}
/* 步骤指示器 */
.step-indicator {
  display: flex;
  justify-content: center;
  gap: 4px;
  margin-bottom: 16px;
  font-size: 11px;
  color: #6a5a4a;
}
.step-indicator .step {
  padding: 2px 8px;
  border: 1px solid #3a2a1a;
  border-radius: 2px;
}
.step-indicator .step.active { border-color: #c8a878; color: #c8a878; }
.step-indicator .step.done { border-color: #5a6a4a; color: #8aaa7a; }
.step-indicator .arrow { padding: 2px 4px; }

/* 战役选择 */
.campaign-selector {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  padding-bottom: 12px;
  border-bottom: 1px solid #3a2a1a;
}
.btn-campaign {
  flex: 1;
  padding: 6px;
  border: 1px solid #3a2a1a;
  background: #221a12;
  color: #8a7a6a;
  border-radius: 4px;
  cursor: pointer;
  font-size: 11px;
}
.btn-campaign:hover { border-color: #5a4a38; color: #c8a878; }
.btn-campaign.active { border-color: #c8a878; color: #c8a878; }

/* 战役信息 */
.campaign-info {
  text-align: center;
  font-size: 12px;
  color: #8a7a6a;
  margin-bottom: 16px;
  padding: 6px;
  border-bottom: 1px solid #3a2a1a;
}
.campaign-info .title { color: #c8a878; font-size: 14px; }

/* === 4 区布局 === */

/* 1. 情报面板 - 灰底，原文不加修饰 */
.intel-panel {
  background: #1e1812;
  border: 1px solid #3a2a1a;
  border-radius: 4px;
  padding: 12px;
  margin-bottom: 8px;
}
.intel-header {
  font-size: 11px;
  color: #6a5a4a;
  margin-bottom: 6px;
  display: flex;
  justify-content: space-between;
}
.intel-body {
  font-size: 13px;
  line-height: 1.7;
  color: #d4c8b8;
}
.intel-meta {
  margin-top: 6px;
  font-size: 11px;
  color: #7a6a5a;
  display: flex;
  gap: 16px;
}
.intel-meta .tag {
  display: inline-block;
  padding: 1px 6px;
  border-radius: 2px;
  font-size: 10px;
}
.tag-cred-high { background: #2a3a2a; color: #8aaa7a; }
.tag-cred-mid { background: #3a3a2a; color: #c8b86a; }
.tag-cred-low { background: #3a2a2a; color: #c87a6a; }
.tag-age-fresh { color: #8aaa7a; }
.tag-age-stale { color: #c87a6a; }
.tag-age-old { color: #6a5a4a; }

/* 2. 参谋长分析框 - 虚线边框，不同底色 */
.chief-staff-panel {
  background: #222820;
  border: 1px dashed #6a8a5a;
  border-radius: 4px;
  padding: 12px;
  margin-bottom: 8px;
}
.chief-staff-header {
  font-size: 11px;
  color: #8aaa7a;
  margin-bottom: 6px;
  display: flex;
  justify-content: space-between;
}
.chief-staff-header .badge {
  font-size: 10px;
  color: #8aaa7a;
  border: 1px solid #6a8a5a;
  padding: 1px 6px;
  border-radius: 2px;
}
.chief-staff-body {
  font-size: 13px;
  line-height: 1.7;
  color: #c8d8b8;
}
.chief-staff-body .judgment { margin-bottom: 6px; }
.chief-staff-body .intent-suggest {
  margin-top: 6px;
  padding: 6px 8px;
  background: #1a2820;
  border-left: 3px solid #8aaa7a;
  font-size: 12px;
  color: #a8c898;
}
.chief-staff-footer {
  margin-top: 6px;
  font-size: 10px;
  color: #5a6a4a;
  font-style: italic;
}

/* 3. 行动面板 */
.action-panel {
  margin-bottom: 8px;
}
.action-label {
  font-size: 11px;
  color: #8a7a6a;
  margin-bottom: 6px;
}
.action-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.btn-action {
  padding: 10px 18px;
  border: 1px solid #5a4a38;
  background: #3a3024;
  color: #d4c8b8;
  border-radius: 4px;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-action:hover {
  background: #4a3a28;
  border-color: #c8a878;
}
.btn-action:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}

/* 4. 意图反馈标签 - 纯标签不可交互 */
.intent-feedback {
  display: none;
  margin-bottom: 8px;
  padding: 8px 12px;
  background: #2a2820;
  border-left: 3px solid #c8a878;
  font-size: 13px;
  color: #c8a878;
}
.intent-feedback.visible { display: block; }

/* 切换代价 */
.switch-cost {
  display: none;
  margin-bottom: 8px;
  padding: 8px 12px;
  background: #2a2820;
  border: 1px solid #4a3a28;
  font-size: 12px;
  color: #aa8a6a;
  line-height: 1.6;
}
.switch-cost.visible { display: block; }
.switch-cost .cost-item {
  padding: 2px 0;
}
.switch-cost .cost-label { color: #c86a4a; }

/* 重置 */
.btn-reset {
  display: block;
  width: 100%;
  margin-top: 12px;
  padding: 8px;
  border: 1px solid #4a3a28;
  background: #2a2218;
  color: #8a7a6a;
  border-radius: 4px;
  cursor: pointer;
  font-size: 12px;
}
.btn-reset:hover { background: #3a3024; color: #c8a878; }

/* 决策历史 */
.decision-log {
  margin-top: 12px;
  border-top: 1px solid #3a2a1a;
  padding-top: 8px;
}
.decision-log-header {
  font-size: 11px;
  color: #6a5a4a;
  margin-bottom: 4px;
}
.decision-log-item {
  font-size: 11px;
  color: #8a7a6a;
  padding: 3px 0;
  border-bottom: 1px solid #2a2218;
}

/* 场景标签 */
.scenario-tag {
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 2px;
  margin-left: 8px;
}
.scenario-normal { background: #2a3a2a; color: #8aaa7a; }
.scenario-mislead { background: #3a2a2a; color: #c87a6a; }
.scenario-contradict { background: #3a3828; color: #c8b86a; }
</style>
</head>
<body>

<div class="prototype" id="app">
  <h1>指 挥 所 — 参谋长模式</h1>

  <div class="campaign-selector" id="campaignSelector"></div>

  <div class="step-indicator">
    <span class="step" id="step1">① 情报接收</span>
    <span class="arrow">→</span>
    <span class="step" id="step2">② 参谋长分析</span>
    <span class="arrow">→</span>
    <span class="step" id="step3">③ 指挥官决策</span>
    <span class="arrow">→</span>
    <span class="step" id="step4">④ 意图反馈</span>
  </div>

  <div class="campaign-info">
    <div class="title" id="campaignTitle"></div>
    <div id="campaignDesc"></div>
  </div>

  <!-- 1. 情报面板 -->
  <div class="intel-panel">
    <div class="intel-header">
      <span>📡 战场情报</span>
      <span id="intelPhase">第 1 回合</span>
    </div>
    <div class="intel-body" id="intelBody"></div>
    <div class="intel-meta" id="intelMeta"></div>
  </div>

  <!-- 2. 参谋长分析框 -->
  <div class="chief-staff-panel" id="chiefStaffPanel" style="display:block;">
    <div class="chief-staff-header">
      <span>🎖️ 参谋长分析</span>
      <span class="badge">参谋部 · 仅供指挥官参考</span>
    </div>
    <div class="chief-staff-body" id="chiefStaffBody">
      <div class="judgment" id="csJudgment"></div>
      <div class="intent-suggest" id="csSuggest"></div>
    </div>
    <div class="chief-staff-footer">— 参谋长已阅读上述情报，以上为参谋部分析建议 —</div>
  </div>

  <!-- 4. 意图反馈标签 -->
  <div class="intent-feedback" id="intentFeedback"></div>

  <!-- 切换代价 -->
  <div class="switch-cost" id="switchCost"></div>

  <!-- 3. 行动面板 -->
  <div class="action-panel">
    <div class="action-label">📋 指挥官决策</div>
    <div class="action-buttons" id="actionButtons"></div>
  </div>

  <!-- 决策历史 -->
  <div class="decision-log" id="decisionLog" style="display:none;">
    <div class="decision-log-header">📜 决策记录</div>
    <div id="decisionLogList"></div>
  </div>

  <button class="btn-reset" id="resetBtn">↺ 重置战役</button>
  <div style="font-size:10px;color:#4a3a28;text-align:center;margin-top:8px;">
    参谋长模式 · 情报→分析→决策→反馈 · 意图是判断的副产品
  </div>
</div>

<script>
// === 战役配置（5 场景：2 基准 + 3 边缘） ===
const SCENARIOS = {

};

const INTENT_MAP = {
  defend: { label: '⚡ 积极防御', desc: '抢时间、主动出击、在有利条件下打' },
  protect: { label: '🛡️ 保护平民', desc: '避免附带损伤，优先保障平民安全' },
  scout: { label: '🕵️ 收集情报', desc: '敌情不明，优先摸清状况再做决策' }
};

// 当前状态
let currentId = null;
let currentTurn = 1;
let decisionCount = 0;
let previousIntent = null;
let decisionLog = [];

const campaignSelector = document.getElementById('campaignSelector');
const campaignTitle = document.getElementById('campaignTitle');
const campaignDesc = document.getElementById('campaignDesc');
const intelBody = document.getElementById('intelBody');
const intelMeta = document.getElementById('intelMeta');
const intelPhase = document.getElementById('intelPhase');
const csJudgment = document.getElementById('csJudgment');
const csSuggest = document.getElementById('csSuggest');
const intentFeedback = document.getElementById('intentFeedback');
const switchCost = document.getElementById('switchCost');
const actionButtons = document.getElementById('actionButtons');
const decisionLogEl = document.getElementById('decisionLog');
const decisionLogList = document.getElementById('decisionLogList');
const resetBtn = document.getElementById('resetBtn');

function updateSteps(active) {
  [1,2,3,4].forEach(i => {
    const el = document.getElementById('step' + i);
    el.classList.remove('active', 'done');
    if (i < active) el.classList.add('done');
    else if (i === active) el.classList.add('active');
  });
}

function renderIntel(scenario, turn) {
  const sc = SCENARIOS[scenario];
  if (!sc) return;

  // 第一回合显示原始情报，之后展示 afterIntel
  if (turn === 1) {
    intelBody.innerHTML = sc.intel.map(i => `<p style="margin-bottom:4px;">${i.text}</p>`).join('');
    intelMeta.innerHTML = sc.intel.map(i => {
      const credClass = 'tag-cred-' + (i.credLabel === '高' ? 'high' : i.credLabel === '低' ? 'low' : 'mid');
      const ageClass = i.age.includes('小时') ? (parseInt(i.age) <= 3 ? 'tag-age-fresh' : 'tag-age-stale') : 'tag-age-stale';
      return `<span>最后确认：<span class="${ageClass}">${i.age}</span></span>
              <span>可信度：<span class="tag ${credClass}">${i.credLabel}</span></span>`;
    }).join(' | ');
  } else {
    intelBody.innerHTML = `<p>${sc.afterIntel || sc.intel[0].text}</p>`;
    const cred = sc.afterCred || sc.intel[0].credLabel;
    const age = sc.afterAge || sc.intel[0].age;
    const credClass = 'tag-cred-' + (cred === '高' ? 'high' : cred === '低' ? 'low' : 'mid');
    intelMeta.innerHTML = `<span>最后确认：${age}</span>
                            <span>可信度：<span class="tag ${credClass}">${cred}</span></span>`;
  }
  intelPhase.textContent = '第 ' + turn + ' 回合';
}

function renderChiefStaff(scenario) {
  const sc = SCENARIOS[scenario];
  csJudgment.textContent = sc.chiefStaff.judgment;
  csSuggest.innerHTML = `<strong>建议意图：${INTENT_MAP[sc.chiefStaff.intent].label}</strong> — ${sc.chiefStaff.explain}`;
}

function renderActions(scenario) {
  const sc = SCENARIOS[scenario];
  actionButtons.innerHTML = sc.actions.map((a, i) =>
    `<button class="btn-action" data-action="${a.id}" data-intent="${a.intent}" data-desc="${a.desc}">${a.label}</button>`
  ).join('');
}

function loadScenario(id) {
  const sc = SCENARIOS[id];
  if (!sc) return;

  currentId = id;
  currentTurn = 1;
  decisionCount = 0;
  previousIntent = null;
  decisionLog = [];

  // 标签页高亮
  document.querySelectorAll('.btn-campaign').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.scenario === id);
  });

  // 战役信息
  const tagClass = 'scenario-' + sc.tag;
  campaignTitle.textContent = sc.name + ` <span class="scenario-tag ${tagClass}">${sc.tagLabel}</span>`;
  campaignDesc.textContent = sc.description;

  // 渲染情报、参谋长、行动
  updateSteps(1);
  renderIntel(id, 1);
  renderChiefStaff(id);
  renderActions(id);

  // 隐藏反馈和代价
  intentFeedback.classList.remove('visible');
  switchCost.classList.remove('visible');
  decisionLogEl.style.display = 'none';
}

function handleDecision(actionId) {
  const sc = SCENARIOS[currentId];
  const action = sc.actions.find(a => a.id === actionId);
  if (!action) return;

  decisionCount++;

  // 1. 锁定按钮
  document.querySelectorAll('.btn-action').forEach(btn => {
    btn.disabled = true;
  });

  // 2. 判断意图是否切换
  const newIntent = action.intent;
  const isSwitch = previousIntent && newIntent !== previousIntent;

  // 3. 显示意图反馈
  const intentLabel = INTENT_MAP[newIntent].label;
  intentFeedback.innerHTML = `🎯 系统分析：你的决策"${action.label}"表明你的指挥意图为 <strong>${intentLabel}</strong>（${INTENT_MAP[newIntent].desc}）`;
  intentFeedback.classList.add('visible');

  // 4. 显示切换代价
  if (decisionCount === 1) {
    // 第一次决策：显示代价
    switchCost.innerHTML = `
      <div class="cost-item"><span class="cost-label">⏱</span> 时间推进——决策消耗 1 个回合</div>
      <div class="cost-item"><span class="cost-label">📡</span> 通信队列——命令正在传达到各部队</div>
    `;
    switchCost.classList.add('visible');
  } else if (isSwitch) {
    // 意图切换：显示更多代价
    switchCost.innerHTML = `
      <div class="cost-item"><span class="cost-label">⏱</span> 时间推进 +1 回合（当前第 ${decisionCount + 1} 回合）</div>
      <div class="cost-item"><span class="cost-label">🔄</span> 意图切换——部队刚准备执行前一计划，又收到新命令</div>
      <div class="cost-item"><span class="cost-label">📡</span> 情报时效磨损——旧情报的可信度在下降</div>
    `;
    switchCost.classList.add('visible');
  } else {
    switchCost.innerHTML = `
      <div class="cost-item"><span class="cost-label">⏱</span> 时间推进 +1 回合（当前第 ${decisionCount + 1} 回合）</div>
      <div class="cost-item"><span class="cost-label">📡</span> 持续执行——部队按当前意图继续行动</div>
    `;
    switchCost.classList.add('visible');
  }

  // 5. 记录决策
  decisionLog.push({
    turn: currentTurn,
    decision: action.label,
    intent: INTENT_MAP[newIntent].label,
    isSwitch: isSwitch
  });
  decisionLogEl.style.display = 'block';
  decisionLogList.innerHTML = decisionLog.map((log, i) =>
    `<div class="decision-log-item">回合 ${log.turn}：${log.decision} → ${log.intent}${log.isSwitch ? ' 🔄 意图切换' : ''}</div>`
  ).join('');

  // 6. 更新情报（第二回合情报）
  currentTurn++;
  previousIntent = newIntent;
  updateSteps(1);
  renderIntel(currentId, currentTurn);
  renderChiefStaff(currentId);

  // 7. 更新参谋长分析框添加"后续提示"
  csJudgment.textContent = sc.chiefStaff.judgment + ' 你的决策已下达，部队正在执行。';

  // 8. 恢复按钮——但提供新的决策选项（简化，仍用原行动集）
  setTimeout(() => {
    document.querySelectorAll('.btn-action').forEach(btn => {
      btn.disabled = false;
    });
    // 同步更新步进显示
    updateSteps(3);
  }, 400);
}

function resetScenario() {
  loadScenario(currentId);
}

// 渲染选择器
const scenarioKeys = Object.keys(SCENARIOS);
campaignSelector.innerHTML = scenarioKeys.map(id => {
  const sc = SCENARIOS[id];
  return `<button class="btn-campaign" data-scenario="${id}">${sc.name}</button>`;
}).join('');

// 默认加载第一个
loadScenario(scenarioKeys[0]);

// 事件
campaignSelector.addEventListener('click', (e) => {
  const btn = e.target.closest('.btn-campaign');
  if (!btn) return;
  loadScenario(btn.dataset.scenario);
});

actionButtons.addEventListener('click', (e) => {
  const btn = e.target.closest('.btn-action');
  if (!btn || btn.disabled) return;
  handleDecision(btn.dataset.action);
});

resetBtn.addEventListener('click', resetScenario);
</script>

</body>
</html>
