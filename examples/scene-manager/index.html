<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SceneManager — 战棋游戏剧本分支图</title>
<script src="dagre.min.js"></script>
<script src="scenes.js"></script>
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --ink: #24292f; --dim: #6e7781; --line: #d8dee4;
    --accent: #0969da; --hist: #8b949e;
    --c-scanned: #8b949e; --c-draft: #0969da; --c-verified: #bf8700; --c-playable: #1a7f37;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }

  header { padding: 18px 28px 4px; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  header h1 { font-size: 20px; margin: 0; }
  header .meta { color: var(--dim); font-size: 13px; }

  #codex { margin: 10px 28px; padding: 12px 18px; background: var(--card);
           border: 1px solid var(--line); border-radius: 10px;
           display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  #codex .big { font-size: 22px; font-weight: 700; }
  #codex .lbl { color: var(--dim); font-size: 13px; }
  #codex .sep { width: 1px; height: 26px; background: var(--line); }

  #tabs { padding: 12px 28px 0; display: flex; gap: 6px; flex-wrap: wrap; }
  #tabs button { border: 1px solid var(--line); border-bottom: none; background: #eaeef2;
                 color: var(--ink); border-radius: 8px 8px 0 0; padding: 7px 18px;
                 cursor: pointer; font-size: 14px; }
  #tabs button.active { background: var(--card); font-weight: 600; }
  #tabs .badge { font-size: 11px; padding: 1px 8px; border-radius: 8px; color: #fff; margin-left: 6px; }

  #stage { margin: 0 28px 24px; background: var(--card); border: 1px solid var(--line);
           border-radius: 0 10px 10px 10px; padding: 14px 18px 18px; }
  #variant { color: var(--dim); font-size: 14px; margin: 2px 0 4px; }
  #variant b { color: var(--accent); }

  /* 史实线：轻量信息条，不参与布局对齐 */
  #spine-strip { display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
                 padding: 4px 0 10px; font-size: 12px; color: var(--dim); }
  #spine-strip .s-ev { cursor: pointer; padding: 1px 8px; border-radius: 8px;
                       background: #f6f8fa; border: 1px solid var(--line); }
  #spine-strip .s-ev:hover { border-color: var(--ink); color: var(--ink); }

  /* DAG 画布：宽度由布局决定，超宽时横向滚动 */
  #graph-wrap { overflow-x: auto; }
  #graph { position: relative; }
  #graph svg { display: block; }
  #graph svg text { font-family: inherit; }

  /* DAG 节点卡片 */
  .bcard { position: absolute; width: 210px; background: #fff; border: 1.5px solid var(--ink);
           border-radius: 8px; padding: 6px 10px; cursor: pointer;
           box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .bcard .kind { font-size: 10px; border-radius: 6px; padding: 0 6px; margin-right: 6px;
                 color: #fff; vertical-align: 1px; }
  .bcard .k-fork { background: var(--accent); }
  .bcard .k-state { background: #6e7781; }
  .bcard .k-ending { background: #1a7f37; }
  .bcard .opt { font-weight: 600; font-size: 12.5px; line-height: 1.45; }
  .bcard.tbd { border-style: dashed; border-color: var(--dim); }
  .bcard.hist { border-color: var(--hist); background: #f6f8fa; }
  .bcard.hist .opt { color: var(--hist); }
  .bcard.sel { outline: 3px solid var(--accent); outline-offset: 1px; }
  .bcard .note { font-size: 11.5px; color: var(--dim); margin-top: 2px; line-height: 1.4; }
  .bcard .obar { display: grid; grid-template-columns: 1fr 40px; gap: 6px; align-items: center;
                 margin-top: 3px; }
  .bcard .track { height: 11px; background: #eaeef2; border-radius: 3px; overflow: hidden; }
  .bcard .fill { height: 100%; background: linear-gradient(90deg, #58a6ff, #0969da); border-radius: 3px; }
  .bcard .pct { font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }

  /* 详情面板 */
  #panel { margin-top: 6px; border-top: 1px solid var(--line); padding-top: 12px;
           display: grid; grid-template-columns: 1fr 240px; gap: 20px; }
  #panel h3 { margin: 0 0 6px; font-size: 15px; }
  #panel .sub { color: var(--dim); font-size: 13px; }
  #panel a { color: var(--accent); text-decoration: none; font-size: 13px; }
  #panel ul { margin: 4px 0 0; padding-left: 18px; }
  #panel li { margin-bottom: 5px; font-size: 14px; }
</style>
</head>
<body>
<header>
  <h1>战棋游戏 · 剧本分支图</h1>
  <span class="meta" id="meta"></span>
</header>
<div id="codex"></div>
<div id="tabs"></div>
<div id="stage">
  <div id="variant"></div>
  <div id="spine-strip"></div>
  <div id="graph-wrap"><div id="graph"></div></div>
  <div id="panel"></div>
</div>

<script>
const STATUSES = ["scanned", "draft", "verified", "playable"];
const STATUS_CN = { scanned: "已扫描", draft: "草稿", verified: "已校验", playable: "可玩" };
const KIND_CN = { fork: "决策点", state: "分支", ending: "结局" };
const CARD_W = 210;

const S = window.SCENES;

const esc = s => String(s ?? "").replace(/[&<>"']/g,
  c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ---------- 结局图鉴 ---------- */
function codex() {
  let formal = 0, soft = 0, tbd = 0;
  S.scenes.forEach(sc => sc.nodes.forEach(n => {
    if (n.kind === "ending") { if (n.prob !== null) formal++; else soft++; }
    if ((n.kind === "state" || n.kind === "fork") &&
        !sc.nodes.some(c => c.parents.includes(n.id)) && n.parents.length) tbd++;
  }));
  document.getElementById("codex").innerHTML = `
    <div><span class="big">${formal}</span><span class="lbl"> 个正式结局（概率化）</span></div>
    <div class="sep"></div>
    <div><span class="big" style="color:var(--dim)">${soft}</span><span class="lbl"> 个方向性结局（未量化）</span></div>
    <div class="sep"></div>
    <div><span class="big" style="color:var(--dim)">${tbd}</span><span class="lbl"> 条分支待推演</span></div>`;
}
document.getElementById("meta").textContent =
  `数据快照 ${S.generatedAt} · 事实源 scenes/*.md · 改动后 python3 build.py 重建 · 真实历史 = 图中已实现的路径`;

/* ---------- 布局（dagre 分层 DAG，从左到右） ---------- */
function layoutGraph(nodes, heights) {
  const byId = Object.fromEntries(nodes.map(n => [n.id, n]));
  const g = new dagre.graphlib.Graph();
  g.setGraph({ rankdir: "LR", nodesep: 18, ranksep: 48, marginx: 12, marginy: 12 });
  g.setDefaultEdgeLabel(() => ({}));

  // 环守卫：仅跳过会构成回边的父子引用（数据应无环，这里兜底防止 dagre 死循环）
  const st = new Set(), done = new Set(), backEdges = new Set();
  function dfs(n) {
    if (done.has(n.id)) return;
    if (st.has(n.id)) return;
    st.add(n.id);
    n.parents.forEach(pid => {
      const p = byId[pid];
      if (!p) return;
      if (st.has(pid)) { backEdges.add(pid + "->" + n.id); return; }
      dfs(p);
    });
    st.delete(n.id);
    done.add(n.id);
  }
  nodes.forEach(dfs);

  nodes.forEach(n => g.setNode(n.id, { width: CARD_W, height: heights.get(n.id) || 64 }));
  nodes.forEach(n => n.parents.forEach(pid => {
    if (!byId[pid] || backEdges.has(pid + "->" + n.id)) return;
    g.setEdge(pid, n.id);
  }));
  dagre.layout(g);
  return g;
}

/* ---------- 渲染 ---------- */
function renderAll(sc, g, heights) {
  const meta = g.graph();
  const W = meta.width, H = meta.height;

  // 边：源右缘 → 目标左缘的水平贝塞尔
  let svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;
  g.edges().forEach(e => {
    const a = g.node(e.v), b = g.node(e.w);
    const x0 = a.x + a.width / 2, y0 = a.y;
    const x1 = b.x - b.width / 2, y1 = b.y;
    const mx = (x0 + x1) / 2;
    const n = sc.nodes.find(n => n.id === e.w);
    const historical = n && n.historical;
    const explored = isExplored(sc, n);
    svg += `<path d="M${x0},${y0} C${mx},${y0} ${mx},${y1} ${x1},${y1}"
              fill="none" stroke="${historical ? "#8b949e" : "#0969da"}"
              stroke-width="1.6" ${explored ? "" : 'stroke-dasharray="5,4"'}
              opacity="${historical ? .55 : .9}"/>`;
  });
  svg += `</svg>`;

  const cards = sc.nodes.map(n => {
    const p = g.node(n.id);
    const left = p.x - p.width / 2, top = p.y - heights.get(n.id) / 2;
    const bars = n.kind === "ending"
      ? (n.prob !== null
        ? `<div class="obar"><div class="track"><div class="fill" style="width:${esc(n.prob)}%"></div></div>
           <div class="pct">${esc(n.prob)}%</div></div>`
        : `<div class="note">方向性结局（未量化）</div>`)
      : "";
    return `<div class="bcard ${n.kind === "ending" && n.prob === null ? "tbd" : ""}
                   ${n.historical ? "hist" : ""}"
                   style="left:${p.x - p.width / 2}px;top:${top}px"
                   data-id="${esc(n.id)}">
      <div class="opt"><span class="kind k-${esc(n.kind)}">${KIND_CN[n.kind] || n.kind}</span>${esc(n.label)}</div>
      ${n.date ? `<div class="note">${esc(n.date)}</div>` : ""}
      ${bars}
      ${n.note ? `<div class="note">${esc(n.note)}</div>` : ""}
    </div>`;
  }).join("");
  return svg + cards;
}

function isExplored(sc, n) {
  // 已推演：本身是量化结局，或子代中有量化结局
  if (n.kind === "ending") return n.prob !== null;
  return sc.nodes.some(c => c.parents.includes(n.id) &&
    c.kind === "ending" && c.prob !== null);
}

/* ---------- 战役渲染 ---------- */
function renderBattle(idx) {
  const sc = S.scenes[idx];
  document.querySelectorAll("#tabs button").forEach((b, i) =>
    b.classList.toggle("active", i === idx));
  history.replaceState(null, "", "#b" + idx);
  document.getElementById("variant").innerHTML =
    `<b>${esc(sc.battle)}（${esc(sc.year)}）</b>　时间从左向右推进 · 点击节点查看详情`;

  // 史实线降为轻量信息条
  document.getElementById("spine-strip").innerHTML =
    `<span style="color:var(--hist)">史实线</span>` +
    sc.spine.map((s, i) =>
      `<span class="s-ev" data-spine="${i}">${esc(s.date)} ${esc(s.name)}</span>`).join("") ||
    `<span style="color:var(--hist)">（无史实事件）</span>`;

  // 两遍布局：先估高，实测卡片高度后重排
  const heights = new Map();
  let g = layoutGraph(sc.nodes, heights);
  const graphEl = document.getElementById("graph");
  graphEl.innerHTML = renderAll(sc, g, heights);
  graphEl.querySelectorAll(".bcard").forEach(el =>
    heights.set(el.dataset.id, el.offsetHeight + 6));
  g = layoutGraph(sc.nodes, heights);
  graphEl.innerHTML = renderAll(sc, g, heights);
  graphEl.style.width = g.graph().width + "px";
  graphEl.style.height = g.graph().height + "px";

  window._sel = { idx, node: null };
  defaultPanel(idx);
}

/* ---------- 详情面板 ---------- */
function defaultPanel(idx) {
  const sc = S.scenes[idx];
  const list = sc.nodes.map(n =>
    `<li><span class="sub">${KIND_CN[n.kind] || n.kind}</span>　${esc(n.label)}${n.date ? `（${esc(n.date)}）` : ""}</li>`).join("");
  panel(sc, `<h3>${esc(sc.battle)}（${esc(sc.year)}）</h3>
    <div class="sub">节点 ${sc.nodes.length} 个 · 点击图中卡片查看详情 · 灰色路径为真实历史</div>
    <ul>${list}</ul>`);
}
function selectSpine(idx, i) {
  const sc = S.scenes[idx], s = sc.spine[i];
  window._sel = { idx, node: null };
  markSel();
  panel(sc, `<h3>${esc(s.name)}</h3><div class="sub">${esc(s.date)} · 史实事件</div>
    <p class="sub">真实历史路径上的节点。</p>`);
}
function selectNode(idx, id) {
  const sc = S.scenes[idx], n = sc.nodes.find(x => x.id === id);
  if (!n) return;
  window._sel = { idx, node: id };
  markSel();
  const kids = sc.nodes.filter(c => c.parents.includes(id));
  const childList = kids.length
    ? `<ul>${kids.map(c => `<li>${esc(c.label)}${c.kind === "ending" && c.prob !== null ? `（${esc(c.prob)}%）` : ""}</li>`).join("")}</ul>`
    : `<div class="sub">无下游节点</div>`;
  panel(sc, `<h3>${esc(n.label)}</h3>
    <div class="sub">${KIND_CN[n.kind] || n.kind}${n.date ? " · " + esc(n.date) : ""}${n.historical ? " · 史实" : ""}</div>
    ${n.note ? `<div class="sub">${esc(n.note)}</div>` : ""}
    ${n.kind === "ending" && n.prob !== null ? `<div class="sub">发生概率 ${esc(n.prob)}%</div>` : ""}
    <h3 style="margin-top:10px">下游</h3>${childList}
    <p><a href="${esc(sc.file)}" target="_blank">阅读推演原文 →</a></p>`);
}
function panel(sc, html) {
  const concl = sc.structural_conclusions.length
    ? `<h3>结构结论</h3><ul>${sc.structural_conclusions.map(c => `<li>${esc(c)}</li>`).join("")}</ul>` : "";
  document.getElementById("panel").innerHTML =
    `<div>${html}</div><div>${concl}</div>`;
}
function markSel() {
  document.querySelectorAll(".bcard.sel").forEach(c => c.classList.remove("sel"));
  const sel = window._sel;
  if (sel && sel.node) {
    const el = document.querySelector(`.bcard[data-id="${CSS.escape(sel.node)}"]`);
    if (el) el.classList.add("sel");
  }
}

/* ---------- 事件委托 ---------- */
document.getElementById("graph").addEventListener("click", e => {
  const card = e.target.closest(".bcard");
  if (card && window._sel) selectNode(window._sel.idx, card.dataset.id);
});
document.getElementById("spine-strip").addEventListener("click", e => {
  const ev = e.target.closest(".s-ev");
  if (ev && window._sel) selectSpine(window._sel.idx, +ev.dataset.spine);
});

/* ---------- 标签页 ---------- */
const tabsEl = document.getElementById("tabs");
S.scenes.forEach((sc, i) => {
  const b = document.createElement("button");
  b.innerHTML = `${esc(sc.battle)}<span class="badge" style="background:var(--c-${sc.status})">${STATUS_CN[sc.status] || sc.status}</span>`;
  b.onclick = () => renderBattle(i);
  tabsEl.appendChild(b);
});

codex();
const hashTab = /^#b(\d+)$/.exec(location.hash);
renderBattle(hashTab ? Math.min(+hashTab[1], S.scenes.length - 1) : 0);
</script>
</body>
</html>
